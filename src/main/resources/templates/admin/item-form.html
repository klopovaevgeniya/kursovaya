<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Форма товара</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/admin/dashboard}">🛠️ AutoDetail - Админ</a>
    <div class="navbar-nav">
      <a class="nav-link" th:href="@{/admin/dashboard}">Главная</a>
      <a class="nav-link" th:href="@{/admin/items}">Товары</a>
      <a class="nav-link" th:href="@{/admin/suppliers}">Поставщики</a>
      <a class="nav-link" th:href="@{/admin/managers}">Менеджеры</a>
      <a class="nav-link" th:href="@{/admin/statistics}">Статистика</a>
      <a class="nav-link" th:href="@{/admin/reports}">Отчеты</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          <h4 class="card-title mb-0" th:text="${isEdit} ? '✏️ Редактирование товара' : '➕ Создание нового товара'">Форма товара</h4>
        </div>
        <div class="card-body">
          <!-- Сообщения об ошибках -->
          <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show">
            <span th:if="${param.error == 'not_found'}">Товар не найден</span>
            <span th:if="${param.error == 'load_error'}">Ошибка загрузки формы</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>

          <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${error}">Ошибка</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>

          <!-- Упрощенная форма без сложных выражений -->
          <form th:if="${isEdit}" th:action="@{/admin/items/update/{id}(id=${item.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Артикул *</label>
                <input type="text" class="form-control" name="arctical" th:value="${item.arctical}" required placeholder="Например: FILTER-001">
              </div>
              <div class="col-md-6">
                <label class="form-label">Название товара *</label>
                <input type="text" class="form-control" name="name" th:value="${item.name}" required placeholder="Например: Масляный фильтр">
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Цена *</label>
                <div class="input-group">
                  <input type="number" step="0.01" class="form-control" name="price" th:value="${item.price}" placeholder="0.00" required min="0">
                  <span class="input-group-text">₽</span>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Количество *</label>
                <input type="number" class="form-control" name="quantity" th:value="${item.quantity}" placeholder="0" required min="0">
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Поставщик *</label>
                <select class="form-select" name="supplierId" required>
                  <option value="">Выберите поставщика</option>
                  <option th:each="supplier : ${suppliers}"
                          th:value="${supplier.id}"
                          th:text="${supplier.name}"
                          th:selected="${item.supplier != null && item.supplier.id == supplier.id}">
                  </option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Изображение</label>
                <input type="text" class="form-control" name="image" th:value="${item.image}" placeholder="Например: filter.jpg">
              </div>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
              <a th:href="@{/admin/items}" class="btn btn-secondary me-md-2">❌ Отмена</a>
              <button type="submit" class="btn btn-primary">💾 Сохранить изменения</button>
            </div>
          </form>

          <form th:unless="${isEdit}" th:action="@{/admin/items}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Артикул *</label>
                <input type="text" class="form-control" name="arctical" required placeholder="Например: FILTER-001">
              </div>
              <div class="col-md-6">
                <label class="form-label">Название товара *</label>
                <input type="text" class="form-control" name="name" required placeholder="Например: Масляный фильтр">
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Цена *</label>
                <div class="input-group">
                  <input type="number" step="0.01" class="form-control" name="price" placeholder="0.00" required min="0">
                  <span class="input-group-text">₽</span>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Количество *</label>
                <input type="number" class="form-control" name="quantity" placeholder="0" required min="0">
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Поставщик *</label>
                <select class="form-select" name="supplierId" required>
                  <option value="">Выберите поставщика</option>
                  <option th:each="supplier : ${suppliers}"
                          th:value="${supplier.id}"
                          th:text="${supplier.name}">
                  </option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Изображение</label>
                <input type="text" class="form-control" name="image" placeholder="Например: filter.jpg">
              </div>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
              <a th:href="@{/admin/items}" class="btn btn-secondary me-md-2">❌ Отмена</a>
              <button type="submit" class="btn btn-primary">✅ Создать товар</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
