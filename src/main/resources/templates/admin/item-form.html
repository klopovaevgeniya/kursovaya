<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${isEdit} ? 'Редактирование товара' : 'Создание товара'">Форма товара</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/admin/dashboard}">🛠️ AutoDetail - Админ</a>
    <div class="navbar-nav">
      <a class="nav-link" th:href="@{/admin/dashboard}">Главная</a>
      <a class="nav-link" th:href="@{/admin/items}">Товары</a>
      <a class="nav-link" th:href="@{/admin/suppliers}">Поставщики</a>
      <a class="nav-link" th:href="@{/admin/managers}">Менеджеры</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          <h4 class="card-title mb-0" th:text="${isEdit} ? '✏️ Редактирование товара' : '➕ Создание нового товара'"></h4>
        </div>
        <div class="card-body">
          <form th:action="${isEdit} ? @{/admin/items/update/{id}(id=${item.id}) : @{/admin/items}"
                method="post">

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Артикул *</label>
                <input type="text" class="form-control" name="arctical"
                       th:value="${item.arctical}" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Название товара *</label>
                <input type="text" class="form-control" name="name"
                       th:value="${item.name}" required>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Цена *</label>
                <input type="number" step="0.01" class="form-control" name="price"
                       th:value="${item.price}" placeholder="0.00" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Количество *</label>
                <input type="number" class="form-control" name="quantity"
                       th:value="${item.quantity}" placeholder="0" required>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Поставщик (ID) *</label>
                <select class="form-select" name="supplierId" required>
                  <option value="">Выберите поставщика</option>
                  <option th:each="supplier : ${suppliers}"
                          th:value="${supplier.id}"
                          th:text="${supplier.name + ' (ID: ' + supplier.id + ')'}"
                          th:selected="${item.supplierId == supplier.id}">
                  </option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Изображение</label>
                <input type="text" class="form-control" name="image"
                       th:value="${item.image}" placeholder="image.jpg">
              </div>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
              <a th:href="@{/admin/items}" class="btn btn-secondary me-md-2">❌ Отмена</a>
              <button type="submit" class="btn btn-primary" th:text="${isEdit} ? '💾 Сохранить изменения' : '✅ Создать товар'"></button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
