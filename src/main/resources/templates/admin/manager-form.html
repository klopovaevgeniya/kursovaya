<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Редактирование менеджера' : 'Создание менеджера'">Форма менеджера</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">🛠️ AutoDetail - Админ</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/admin/dashboard}">Главная</a>
            <a class="nav-link" th:href="@{/admin/items}">Товары</a>
            <a class="nav-link" th:href="@{/admin/suppliers}">Поставщики</a>
            <a class="nav-link" th:href="@{/admin/managers}">Менеджеры</a>
            <a class="nav-link" th:href="@{/admin/statistics}">Статистика</a>
            <a class="nav-link" th:href="@{/admin/reports}">Отчеты</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title mb-0" th:text="${isEdit} ? '✏️ Редактирование менеджера' : '➕ Создание нового менеджера'"></h4>
                </div>
                <div class="card-body">
                    <!-- Сообщения об ошибках -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="${isEdit} ? @{/admin/managers/update/{id}(id=${manager.id}) : @{/admin/managers}"
                          method="post">

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Имя *</label>
                                <input type="text" class="form-control" name="name"
                                       th:value="${manager.name}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Фамилия *</label>
                                <input type="text" class="form-control" name="surname"
                                       th:value="${manager.surname}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Отчество</label>
                                <input type="text" class="form-control" name="patronymic"
                                       th:value="${manager.patronymic}">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Логин *</label>
                                <input type="text" class="form-control" name="login"
                                       th:value="${manager.login}" required>
                                <div class="form-text">Уникальный логин для входа в систему</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Пароль <span th:if="${isEdit}" class="text-muted">(оставьте пустым, если не меняется)</span></label>
                                <input type="password" class="form-control" name="password"
                                       th:required="${!isEdit}">
                                <div class="form-text" th:if="${isEdit}">Заполняйте только если нужно изменить пароль</div>
                                <div class="form-text" th:if="${!isEdit}">Пароль будет зашифрован автоматически</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Описание</label>
                            <textarea class="form-control" name="description" rows="3"
                                      th:text="${manager.description}"
                                      placeholder="Описание должности или обязанностей..."></textarea>
                            <div class="form-text">Дополнительная информация о менеджере</div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/admin/managers}" class="btn btn-secondary me-md-2">❌ Отмена</a>
                            <button type="submit" class="btn btn-primary" th:text="${isEdit} ? '💾 Сохранить изменения' : '✅ Создать менеджера'"></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
