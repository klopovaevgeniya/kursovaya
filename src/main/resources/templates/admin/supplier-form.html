<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${isEdit} ? 'Редактирование поставщика' : 'Создание поставщика'">Форма поставщика</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/admin/dashboard}">🛠️ AutoDetail - Админ</a>
    <div class="navbar-nav">
      <a class="nav-link" th:href="@{/admin/dashboard}">Главная</a>
      <a class="nav-link" th:href="@{/admin/items}">Товары</a>
      <a class="nav-link" th:href="@{/admin/suppliers}">Поставщики</a>
      <a class="nav-link" th:href="@{/admin/managers}">Менеджеры</a>
      <a class="nav-link" th:href="@{/admin/statistics}">Статистика</a>
      <a class="nav-link" th:href="@{/admin/reports}">Отчеты</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          <h4 class="card-title mb-0" th:text="${isEdit} ? '✏️ Редактирование поставщика' : '➕ Создание нового поставщика'"></h4>
        </div>
        <div class="card-body">
          <form th:action="${isEdit} ? @{/admin/suppliers/update/{id}(id=${supplier.id}) : @{/admin/suppliers}"
                method="post">

            <div class="mb-3">
              <label class="form-label">Название компании *</label>
              <input type="text" class="form-control" name="name"
                     th:value="${supplier.name}"
                     placeholder="Введите название компании..." required>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Контактный телефон *</label>
                <input type="tel" class="form-control" name="contactPhone"
                       th:value="${supplier.contactPhone}"
                       placeholder="+7 (XXX) XXX-XX-XX" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Контактный email</label>
                <input type="email" class="form-control" name="contactEmail"
                       th:value="${supplier.contactEmail}"
                       placeholder="email@example.com">
              </div>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
              <a th:href="@{/admin/suppliers}" class="btn btn-secondary me-md-2">❌ Отмена</a>
              <button type="submit" class="btn btn-primary" th:text="${isEdit} ? '💾 Сохранить изменения' : '✅ Создать поставщика'"></button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
