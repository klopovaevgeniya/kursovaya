<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Доступ запрещен</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card">
                <div class="card-body">
                    <h1 class="text-danger">🚫 Доступ запрещен</h1>
                    <p class="lead">У вас недостаточно прав для просмотра этой страницы.</p>
                    <p>Обратитесь к администратору для получения доступа.</p>
                    <div class="mt-4">
                        <a th:href="@{/}" class="btn btn-primary">На главную</a>
                        <a th:href="@{/auth/logout}" class="btn btn-secondary">Выйти</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
