<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Доступ запрещен</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:insert="~{fragments/header :: header}"></div>

<div class="main-content">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card error-card">
                    <div class="card-body error-body">
                        <div class="error-icon">🚫</div>
                        <h1 class="error-title">Доступ запрещен</h1>
                        <p class="error-text">У вас недостаточно прав для просмотра этой страницы.</p>
                        <p class="error-subtext">Обратитесь к администратору для получения доступа.</p>
                        <div class="mt-4 error-actions">
                            <a th:href="@{/}" class="btn btn-primary me-3">На главную</a>
                            <a th:href="@{/auth/logout}" class="btn btn-outline-primary">Выйти</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:insert="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
