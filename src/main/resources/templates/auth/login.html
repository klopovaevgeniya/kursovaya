<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 100%);
            --bg-card: white;
            --text-primary: #1f2937;
            --text-secondary: #64748b;
            --border-color: rgba(0,0,0,0.08);
            --shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --bg-card: #2d3748;
            --text-primary: #f7fafc;
            --text-secondary: #e2e8f0;
            --border-color: rgba(255,255,255,0.1);
            --shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        body {
            background: var(--bg-primary);
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .auth-card {
            background: var(--bg-card);
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: none;
            border-left: 6px solid #7c3aed;
            transition: all 0.3s ease;
        }

        .auth-header {
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            color: white;
            border-radius: 20px 20px 0 0 !important;
            padding: 2rem;
            text-align: center;
            border: none;
        }

        .auth-header h4 {
            font-weight: 700;
            font-size: 1.8rem;
            margin: 0;
        }

        .auth-body {
            padding: 2.5rem;
        }

        .auth-label {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
        }

        .auth-input {
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .auth-input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
            outline: none;
        }

        .auth-btn {
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            border: none;
            border-radius: 12px;
            padding: 0.875rem;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.3);
        }

        .auth-link-btn {
            border: 2px solid #7c3aed;
            color: #7c3aed;
            border-radius: 12px;
            padding: 0.875rem;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: transparent;
        }

        .auth-link-btn:hover {
            background: #7c3aed;
            color: white;
            transform: translateY(-2px);
        }

        .auth-divider {
            color: var(--text-secondary);
            margin: 1.5rem 0;
            font-weight: 500;
            position: relative;
            transition: all 0.3s ease;
        }

        .auth-divider:before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border-color);
            z-index: 1;
        }

        .auth-divider span {
            background: var(--bg-card);
            padding: 0 1rem;
            position: relative;
            z-index: 2;
        }

        .alert-auth {
            border-radius: 12px;
            border: none;
            box-shadow: var(--shadow);
            border-left: 4px solid;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .alert-danger {
            background: #fef2f2;
            color: #dc2626;
            border-left-color: #dc2626;
        }

        .alert-success {
            background: #f0fdf4;
            color: #16a34a;
            border-left-color: #16a34a;
        }

        [data-theme="dark"] .alert-danger {
            background: #7f1d1d;
            color: #fca5a5;
            border-left-color: #ef4444;
        }

        [data-theme="dark"] .alert-success {
            background: #064e3b;
            color: #34d399;
            border-left-color: #10b981;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 5px;
            transition: all 0.3s ease;
            z-index: 3;
        }

        .password-toggle:hover {
            color: var(--text-primary);
        }

        .password-input-group {
            position: relative;
        }

        .password-input-group .form-control {
            padding-right: 45px;
        }

        /* Theme Switch */
        .theme-switch {
            display: flex;
            align-items: center;
            margin-right: 1rem;
        }

        .theme-switch-label {
            margin-right: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* Dark mode adjustments */
        [data-theme="dark"] .auth-input {
            background-color: #4a5568;
            border-color: #718096;
            color: #f7fafc;
        }

        [data-theme="dark"] .auth-input:focus {
            background-color: #4a5568;
            border-color: #7c3aed;
            color: #f7fafc;
        }

        .navbar {
            background: var(--bg-card) !important;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .navbar-brand {
            font-weight: 600;
            color: var(--text-primary) !important;
        }

        .nav-link {
            color: var(--text-secondary) !important;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: var(--text-primary) !important;
        }

        .main-content {
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
        }

        .footer {
            background: var(--bg-card);
            color: var(--text-secondary);
            padding: 1.5rem 0;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
<!-- Навигация -->
<nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🛠️ AutoDetail</a>
        <div class="navbar-nav ms-auto">
            <div class="theme-switch">
                <span class="theme-switch-label">☀️</span>
                <label class="switch">
                    <input type="checkbox" id="themeToggle">
                    <span class="slider"></span>
                </label>
                <span class="theme-switch-label">🌙</span>
            </div>
            <a class="nav-link" th:href="@{/}">🏠 Главная</a>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    <div class="auth-header">
                        <h4>🔐 Вход в систему</h4>
                    </div>
                    <div class="auth-body">
                        <div th:if="${error}" class="alert alert-danger alert-auth" th:text="${error}"></div>
                        <div th:if="${message}" class="alert alert-success alert-auth" th:text="${message}"></div>
                        <div th:if="${success}" class="alert alert-success alert-auth" th:text="${success}"></div>

                        <form th:action="@{/auth/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label auth-label">👤 Логин</label>
                                <input type="text" class="form-control auth-input" id="username" name="username" required placeholder="Введите ваш логин">
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label auth-label">🔒 Пароль</label>
                                <div class="password-input-group">
                                    <input type="password" class="form-control auth-input" id="password" name="password" required placeholder="Введите ваш пароль">
                                    <button type="button" class="password-toggle" id="passwordToggle">
                                        👁️
                                    </button>
                                </div>
                            </div>
                            <button type="submit" class="btn auth-btn mb-4">🚀 Войти в систему</button>
                        </form>

                        <div class="text-center">
                            <p class="auth-divider"><span>или</span></p>
                            <a th:href="@{/auth/register}" class="btn auth-link-btn">📝 Регистрация для клиентов</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Футер -->
<footer class="footer">
    <div class="container text-center">
        <p class="mb-0">&copy; 2024 AutoDetail. Все права защищены.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');
        const themeToggle = document.getElementById('themeToggle');

        // Управление видимостью пароля
        passwordToggle.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordToggle.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                passwordToggle.textContent = '👁️';
            }
        });

        // Управление темой
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeToggle.checked = currentTheme === 'dark';

        themeToggle.addEventListener('change', function() {
            const newTheme = this.checked ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        // Автоматически закрываем алерты через 5 секунд
        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(alert => {
            setTimeout(() => {
                const bsAlert = new bootstrap.Alert(alert);
                bsAlert.close();
            }, 5000);
        });
    });
</script>
</body>
</html>
