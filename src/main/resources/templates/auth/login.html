<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #6c757d;
            padding: 5px;
        }
        .password-toggle:hover {
            color: #495057;
        }
        .password-input-group {
            position: relative;
        }
        .password-input-group .form-control {
            padding-right: 45px;
        }
    </style>
</head>
<body>
<div th:insert="~{fragments/header :: header}"></div>

<div class="main-content">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card auth-card">
                    <div class="card-header auth-header">
                        <h4 class="text-center mb-0">Вход в систему</h4>
                    </div>
                    <div class="card-body auth-body">
                        <div th:if="${error}" class="alert alert-danger alert-auth" th:text="${error}"></div>
                        <div th:if="${message}" class="alert alert-success alert-auth" th:text="${message}"></div>
                        <div th:if="${success}" class="alert alert-success alert-auth" th:text="${success}"></div>

                        <form th:action="@{/auth/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label auth-label">Логин</label>
                                <input type="text" class="form-control auth-input" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label auth-label">Пароль</label>
                                <div class="password-input-group">
                                    <input type="password" class="form-control auth-input" id="password" name="password" required>
                                    <button type="button" class="password-toggle" id="passwordToggle">
                                        👁️
                                    </button>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 auth-btn">Войти</button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="auth-divider">или</p>
                            <a th:href="@{/auth/register}" class="btn btn-outline-primary w-100 auth-link-btn">Регистрация для клиентов</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:insert="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');

        passwordToggle.addEventListener('click', function() {
            // Переключаем тип поля ввода
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordToggle.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                passwordToggle.textContent = '👁️';
            }
        });
    });
</script>
</body>
</html>
