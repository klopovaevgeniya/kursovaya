<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Регистрация клиента</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <style>
    .password-toggle {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #6c757d;
        padding: 5px;
    }
    .password-toggle:hover {
        color: #495057;
    }
    .password-input-group {
        position: relative;
    }
    .password-input-group .form-control {
        padding-right: 45px;
    }
  </style>
</head>
<body>
<div th:insert="~{fragments/header :: header}"></div>

<div class="main-content">
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card auth-card">
          <div class="card-header auth-header">
            <h4 class="text-center mb-0">Регистрация клиента</h4>
          </div>
          <div class="card-body auth-body">
            <div th:if="${error}" class="alert alert-danger alert-auth" th:text="${error}"></div>

            <form th:action="@{/auth/register}" th:object="${client}" method="post">
              <div class="row">
                <div class="col-md-4">
                  <div class="mb-3">
                    <label for="name" class="form-label auth-label">Имя *</label>
                    <input type="text" class="form-control auth-input" id="name" th:field="*{name}" required>
                    <div th:if="${#fields.hasErrors('name')}" class="text-danger error-message">
                      <small th:errors="*{name}"></small>
                    </div>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="mb-3">
                    <label for="surname" class="form-label auth-label">Фамилия *</label>
                    <input type="text" class="form-control auth-input" id="surname" th:field="*{surname}" required>
                    <div th:if="${#fields.hasErrors('surname')}" class="text-danger error-message">
                      <small th:errors="*{surname}"></small>
                    </div>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="mb-3">
                    <label for="patronymic" class="form-label auth-label">Отчество</label>
                    <input type="text" class="form-control auth-input" id="patronymic" th:field="*{patronymic}">
                  </div>
                </div>
              </div>

              <div class="mb-3">
                <label for="phone" class="form-label auth-label">Телефон *</label>
                <input type="tel" class="form-control auth-input" id="phone" th:field="*{phone}" required>
                <div th:if="${#fields.hasErrors('phone')}" class="text-danger error-message">
                  <small th:errors="*{phone}"></small>
                </div>
              </div>

              <div class="mb-3">
                <label for="login" class="form-label auth-label">Логин *</label>
                <input type="text" class="form-control auth-input" id="login" th:field="*{login}" required>
                <div th:if="${#fields.hasErrors('login')}" class="text-danger error-message">
                  <small th:errors="*{login}"></small>
                </div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label auth-label">Пароль *</label>
                <div class="password-input-group">
                  <input type="password" class="form-control auth-input" id="password" th:field="*{password}" required>
                  <button type="button" class="password-toggle" id="passwordToggle">
                    👁️
                  </button>
                </div>
                <div th:if="${#fields.hasErrors('password')}" class="text-danger error-message">
                  <small th:errors="*{password}"></small>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 auth-btn">Зарегистрироваться</button>
            </form>

            <div class="text-center mt-4">
              <p class="auth-divider">Уже есть аккаунт?</p>
              <a th:href="@{/auth/login}" class="btn btn-outline-primary w-100 auth-link-btn">Войти в систему</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:insert="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
      const passwordInput = document.getElementById('password');
      const passwordToggle = document.getElementById('passwordToggle');

      passwordToggle.addEventListener('click', function() {
          // Переключаем тип поля ввода
          if (passwordInput.type === 'password') {
              passwordInput.type = 'text';
              passwordToggle.textContent = '🙈';
          } else {
              passwordInput.type = 'password';
              passwordToggle.textContent = '👁️';
          }
      });
  });
</script>
</body>
</html>
