<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Регистрация клиента</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          <h4 class="text-center">Регистрация клиента</h4>
        </div>
        <div class="card-body">
          <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

          <form th:action="@{/auth/register}" th:object="${client}" method="post">
            <div class="row">
              <div class="col-md-4">
                <div class="mb-3">
                  <label for="name" class="form-label">Имя *</label>
                  <input type="text" class="form-control" id="name" th:field="*{name}" required>
                  <div th:if="${#fields.hasErrors('name')}" class="text-danger">
                    <small th:errors="*{name}"></small>
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="mb-3">
                  <label for="surname" class="form-label">Фамилия *</label>
                  <input type="text" class="form-control" id="surname" th:field="*{surname}" required>
                  <div th:if="${#fields.hasErrors('surname')}" class="text-danger">
                    <small th:errors="*{surname}"></small>
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="mb-3">
                  <label for="patronymic" class="form-label">Отчество</label>
                  <input type="text" class="form-control" id="patronymic" th:field="*{patronymic}">
                </div>
              </div>
            </div>

            <div class="mb-3">
              <label for="phone" class="form-label">Телефон *</label>
              <input type="tel" class="form-control" id="phone" th:field="*{phone}" required>
              <div th:if="${#fields.hasErrors('phone')}" class="text-danger">
                <small th:errors="*{phone}"></small>
              </div>
            </div>

            <div class="mb-3">
              <label for="login" class="form-label">Логин *</label>
              <input type="text" class="form-control" id="login" th:field="*{login}" required>
              <div th:if="${#fields.hasErrors('login')}" class="text-danger">
                <small th:errors="*{login}"></small>
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Пароль *</label>
              <input type="password" class="form-control" id="password" th:field="*{password}" required>
              <div th:if="${#fields.hasErrors('password')}" class="text-danger">
                <small th:errors="*{password}"></small>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
          </form>

          <div class="text-center mt-3">
            <a th:href="@{/auth/login}" class="btn btn-link">Уже есть аккаунт? Войдите</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
