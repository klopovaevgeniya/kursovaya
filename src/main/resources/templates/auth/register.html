<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Регистрация клиента</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-primary: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 100%);
      --bg-card: white;
      --text-primary: #1f2937;
      --text-secondary: #64748b;
      --text-muted: #6b7280;
      --border-color: rgba(0,0,0,0.08);
      --shadow: 0 10px 25px rgba(0,0,0,0.08);
      --shadow-hover: 0 15px 35px rgba(0,0,0,0.12);
      --primary-gradient: linear-gradient(135deg, #7c3aed, #a78bfa);
    }

    [data-theme="dark"] {
      --bg-primary: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      --bg-card: #2d3748;
      --text-primary: #f7fafc;
      --text-secondary: #e2e8f0;
      --text-muted: #cbd5e0;
      --border-color: rgba(255,255,255,0.1);
      --shadow: 0 10px 25px rgba(0,0,0,0.3);
      --shadow-hover: 0 15px 35px rgba(0,0,0,0.4);
    }

    body {
      background: var(--bg-primary);
      min-height: 100vh;
      transition: all 0.3s ease;
    }

    .auth-card {
      background: var(--bg-card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: none;
      border-left: 6px solid #7c3aed;
      transition: all 0.3s ease;
    }

    .auth-header {
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      color: white;
      border-radius: 20px 20px 0 0 !important;
      padding: 2rem;
      text-align: center;
      border: none;
    }

    .auth-header h4 {
      font-weight: 700;
      font-size: 1.8rem;
      margin: 0;
      background: linear-gradient(135deg, #ffffff, #e2e8f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .auth-body {
      padding: 2.5rem;
    }

    .auth-label {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
      transition: all 0.3s ease;
    }

    .auth-input {
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .auth-input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
      outline: none;
    }

    .auth-btn {
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      border: none;
      border-radius: 12px;
      padding: 0.875rem;
      font-weight: 600;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      margin-top: 1rem;
    }

    .auth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(124, 58, 237, 0.3);
    }

    .auth-link-btn {
      border: 2px solid #7c3aed;
      color: #7c3aed;
      border-radius: 12px;
      padding: 0.75rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .auth-link-btn:hover {
      background: #7c3aed;
      color: white;
      transform: translateY(-2px);
    }

    .auth-divider {
      color: var(--text-muted);
      margin: 1.5rem 0;
      position: relative;
      transition: all 0.3s ease;
    }

    .auth-divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--border-color);
    }

    .auth-divider::after {
      content: attr(class);
      background: var(--bg-card);
      padding: 0 1rem;
      position: relative;
    }

    .alert-auth {
      border-radius: 12px;
      border: none;
      box-shadow: var(--shadow);
      border-left: 4px solid;
      padding: 1rem 1.5rem;
      margin-bottom: 2rem;
      transition: all 0.3s ease;
    }

    .alert-danger {
      background: #fef2f2;
      color: #dc2626;
      border-left-color: #dc2626;
    }

    [data-theme="dark"] .alert-danger {
      background: #7f1d1d;
      color: #fca5a5;
      border-left-color: #ef4444;
    }

    .error-message {
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 5px;
      transition: all 0.3s ease;
      z-index: 2;
    }

    .password-toggle:hover {
      color: var(--text-primary);
      transform: translateY(-50%) scale(1.1);
    }

    .password-input-group {
      position: relative;
    }

    .password-input-group .form-control {
      padding-right: 45px;
    }

    /* Theme Switch */
    .theme-switch {
      display: flex;
      align-items: center;
      margin-right: 1rem;
    }

    .theme-switch-label {
      margin-right: 0.5rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    /* Dark mode adjustments */
    [data-theme="dark"] .auth-input {
      background-color: #4a5568;
      border-color: #718096;
      color: #f7fafc;
    }

    [data-theme="dark"] .auth-input:focus {
      background-color: #4a5568;
      border-color: #7c3aed;
      color: #f7fafc;
    }

    /* Header styles */
    .navbar-brand {
      font-weight: 600;
    }

    .main-content {
      padding: 2rem 0;
    }

    @media (max-width: 768px) {
      .auth-body {
        padding: 1.5rem;
      }

      .auth-header {
        padding: 1.5rem;
      }

      .auth-header h4 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
<!-- Flash Messages -->
<div class="alert-container">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
</div>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">🛠️ AutoDetail</a>
    <div class="navbar-nav ms-auto">
      <div class="theme-switch">
        <span class="theme-switch-label">☀️</span>
        <label class="switch">
          <input type="checkbox" id="themeToggle">
          <span class="slider"></span>
        </label>
        <span class="theme-switch-label">🌙</span>
      </div>
      <a class="nav-link" th:href="@{/auth/login}">Вход</a>
      <a class="nav-link active" th:href="@{/auth/register}">Регистрация</a>
    </div>
  </div>
</nav>

<div class="main-content">
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card auth-card">
          <div class="card-header auth-header">
            <h4 class="text-center mb-0">📝 Регистрация клиента</h4>
          </div>
          <div class="card-body auth-body">
            <div th:if="${error}" class="alert alert-danger alert-auth" th:text="${error}"></div>

            <form th:action="@{/auth/register}" th:object="${client}" method="post">
              <div class="row">
                <div class="col-md-4">
                  <div class="mb-3">
                    <label for="name" class="form-label auth-label">Имя *</label>
                    <input type="text" class="form-control auth-input" id="name" th:field="*{name}" required placeholder="Введите имя">
                    <div th:if="${#fields.hasErrors('name')}" class="text-danger error-message">
                      <small th:errors="*{name}"></small>
                    </div>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="mb-3">
                    <label for="surname" class="form-label auth-label">Фамилия *</label>
                    <input type="text" class="form-control auth-input" id="surname" th:field="*{surname}" required placeholder="Введите фамилию">
                    <div th:if="${#fields.hasErrors('surname')}" class="text-danger error-message">
                      <small th:errors="*{surname}"></small>
                    </div>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="mb-3">
                    <label for="patronymic" class="form-label auth-label">Отчество</label>
                    <input type="text" class="form-control auth-input" id="patronymic" th:field="*{patronymic}" placeholder="Введите отчество">
                  </div>
                </div>
              </div>

              <div class="mb-3">
                <label for="phone" class="form-label auth-label">📞 Телефон *</label>
                <input type="tel" class="form-control auth-input" id="phone" th:field="*{phone}" required placeholder="+7 (999) 123-45-67">
                <div th:if="${#fields.hasErrors('phone')}" class="text-danger error-message">
                  <small th:errors="*{phone}"></small>
                </div>
              </div>

              <div class="mb-3">
                <label for="login" class="form-label auth-label">👤 Логин *</label>
                <input type="text" class="form-control auth-input" id="login" th:field="*{login}" required placeholder="Введите логин">
                <div th:if="${#fields.hasErrors('login')}" class="text-danger error-message">
                  <small th:errors="*{login}"></small>
                </div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label auth-label">🔐 Пароль *</label>
                <div class="password-input-group">
                  <input type="password" class="form-control auth-input" id="password" th:field="*{password}" required placeholder="Введите пароль">
                  <button type="button" class="password-toggle" id="passwordToggle">
                    👁️
                  </button>
                </div>
                <div th:if="${#fields.hasErrors('password')}" class="text-danger error-message">
                  <small th:errors="*{password}"></small>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 auth-btn">✅ Зарегистрироваться</button>
            </form>

            <div class="text-center mt-4">
              <p class="auth-divider">Уже есть аккаунт?</p>
              <a th:href="@{/auth/login}" class="btn btn-outline-primary w-100 auth-link-btn">🚪 Войти в систему</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="bg-dark text-light py-4 mt-5">
  <div class="container text-center">
    <p class="mb-0">&copy; 2024 AutoDetail. Все права защищены.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Theme management
  document.addEventListener('DOMContentLoaded', function() {
      const themeToggle = document.getElementById('themeToggle');
      const currentTheme = localStorage.getItem('theme') || 'light';

      // Apply saved theme
      document.documentElement.setAttribute('data-theme', currentTheme);
      themeToggle.checked = currentTheme === 'dark';

      // Toggle theme
      themeToggle.addEventListener('change', function() {
          const newTheme = this.checked ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', newTheme);
          localStorage.setItem('theme', newTheme);
      });

      const passwordInput = document.getElementById('password');
      const passwordToggle = document.getElementById('passwordToggle');

      passwordToggle.addEventListener('click', function() {
          // Переключаем тип поля ввода
          if (passwordInput.type === 'password') {
              passwordInput.type = 'text';
              passwordToggle.textContent = '🙈';
          } else {
              passwordInput.type = 'password';
              passwordToggle.textContent = '👁️';
          }
      });

      // Автоматически закрываем алерты через 5 секунд
      const alerts = document.querySelectorAll('.alert');
      alerts.forEach(alert => {
          setTimeout(() => {
              const bsAlert = new bootstrap.Alert(alert);
              bsAlert.close();
          }, 5000);
      });
  });
</script>
</body>
</html>
