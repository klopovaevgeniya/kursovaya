<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Магазин автозапчастей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🛠️ AutoDetail</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/auth/login}">Вход</a>
            <a class="nav-link" th:href="@{/auth/register}">Регистрация</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="jumbotron text-center">
        <h1 class="display-4">Добро пожаловать в AutoDetail!</h1>
        <p class="lead">Магазин автозапчастей с полным ассортиментом</p>
        <hr class="my-4">
        <p>Выберите действие для продолжения:</p>
        <div class="mt-4">
            <a th:href="@{/auth/login}" class="btn btn-primary btn-lg me-3">Войти в систему</a>
            <a th:href="@{/auth/register}" class="btn btn-success btn-lg">Регистрация для клиентов</a>
        </div>
    </div>
</div>

<!-- Добавьте JavaScript для Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
