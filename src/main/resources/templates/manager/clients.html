<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Клиенты - Панель менеджера</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/manager/dashboard}">🛠️ AutoDetail - Менеджер</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/manager/dashboard}">Главная</a>
            <a class="nav-link" th:href="@{/manager/items}">Товары</a>
            <a class="nav-link active" th:href="@{/manager/clients}">Клиенты</a>
            <a class="nav-link" th:href="@{/manager/orders}">Заказы</a>
            <a class="nav-link" th:href="@{/manager/messages}">Сообщения</a>
        </div>
        <div class="navbar-nav ms-auto">
                <span class="navbar-text text-light me-3">
                    Вы вошли как: <strong>Менеджер</strong>
                </span>
            <form th:action="@{/auth/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">🚪 Выйти</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>👥 Управление клиентами</h1>
        <div class="text-muted">
            Всего клиентов: <span th:text="${totalClients}">0</span>
        </div>
    </div>

    <!-- Поиск -->
    <div class="card mb-4">
        <div class="card-header">
            <h5 class="card-title mb-0">🔍 Поиск клиентов</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/manager/clients}" method="get" class="row g-3">
                <div class="col-md-8">
                    <input type="text" class="form-control" name="search" th:value="${search}"
                           placeholder="Поиск по имени, фамилии или телефону...">
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-primary w-100">Найти</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Список клиентов -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0" th:text="${searchType}">Все клиенты</h5>
            <span class="badge bg-primary" th:text="${'Найдено: ' + totalClients}"></span>
        </div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(clients)}" class="text-center text-muted py-4">
                <h4>😔 Клиенты не найдены</h4>
                <p>Попробуйте изменить параметры поиска</p>
            </div>

            <div th:if="${not #lists.isEmpty(clients)}" class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>ФИО</th>
                        <th>Телефон</th>
                        <th>Логин</th>
                        <th>ID машины</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="client : ${clients}">
                        <td th:text="${client.id}"></td>
                        <td>
                            <strong th:text="${client.surname + ' ' + client.name + ' ' + (client.patronymic != null ? client.patronymic : '')}"></strong>
                        </td>
                        <td th:text="${client.phone}"></td>
                        <td th:text="${client.login}"></td>
                        <td>
                                    <span th:if="${client.idCar != null}"
                                          class="badge bg-info"
                                          th:text="${client.idCar}">
                                    </span>
                            <span th:if="${client.idCar == null}"
                                  class="badge bg-secondary">
                                        Не указано
                                    </span>
                        </td>
                        <td>
                            <a th:href="@{/manager/orders(clientId=${client.id})}"
                               class="btn btn-sm btn-outline-primary">
                                Заказы
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
