<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма заказа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root {
            --bg-primary: #f8f9fa;
            --bg-card: white;
            --bg-navbar: #212529;
            --text-primary: #1f2937;
            --text-secondary: #64748b;
            --text-muted: #6b7280;
            --border-color: rgba(0,0,0,0.08);
            --shadow: 0 10px 25px rgba(0,0,0,0.08);
            --shadow-hover: 0 15px 35px rgba(0,0,0,0.12);
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-card: #2d3748;
            --bg-navbar: #1a202c;
            --text-primary: #f7fafc;
            --text-secondary: #e2e8f0;
            --text-muted: #cbd5e0;
            --border-color: rgba(255,255,255,0.1);
            --shadow: 0 10px 25px rgba(0,0,0,0.3);
            --shadow-hover: 0 15px 35px rgba(0,0,0,0.4);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .card {
            background: var(--bg-card);
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: none;
            transition: all 0.3s ease;
        }

        .card-header {
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            color: white;
            border-radius: 20px 20px 0 0 !important;
            padding: 2rem;
            border: none;
        }

        .card-title {
            background: linear-gradient(135deg, #dc2626 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .card-subtitle {
            opacity: 0.9;
            margin: 0;
            font-size: 1.1rem;
        }

        .card-body {
            padding: 2rem;
        }

        .form-label {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
        }

        .form-control, .form-select {
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .form-control:focus, .form-select:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
            outline: none;
        }

        .form-control:read-only {
            background-color: var(--data-theme="dark" ? #4a5568 : #f8fafc);
        }

        .input-group-text {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .btn {
            border-radius: 12px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            color: white;
        }

        .btn-primary:hover {
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.3);
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white;
        }

        .btn-success:hover {
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #f87171);
            color: white;
        }

        .btn-danger:hover {
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.3);
        }

        .table {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .table thead th {
            background: #374151 !important;
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table tbody tr {
            transition: all 0.3s ease;
            border-bottom: 1px solid var(--border-color);
        }

        .table tbody tr:hover {
            background-color: var(--data-theme="dark" ? #4a5568 : #f8fafc);
        }

        .table tbody td {
            padding: 1rem 1.5rem;
            vertical-align: middle;
            border: none;
            color: var(--text-primary);
        }

        .table tfoot {
            background: var(--data-theme="dark" ? #4a5568 : #f8fafc);
        }

        .table tfoot td {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        /* Theme Switch */
        .theme-switch {
            display: flex;
            align-items: center;
            margin-right: 1rem;
        }

        .theme-switch-label {
            margin-right: 0.5rem;
            color: #dee2e6;
            font-weight: 500;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* Dark mode adjustments */
        [data-theme="dark"] .form-control,
        [data-theme="dark"] .form-select {
            background-color: #4a5568;
            border-color: #718096;
            color: #f7fafc;
        }

        [data-theme="dark"] .form-control:focus,
        [data-theme="dark"] .form-select:focus {
            background-color: #4a5568;
            border-color: #7c3aed;
            color: #f7fafc;
        }

        [data-theme="dark"] .input-group-text {
            background: #4a5568;
            border-color: #718096;
            color: #e2e8f0;
        }

        [data-theme="dark"] .form-control:read-only {
            background-color: #4a5568;
        }

        .text-muted {
            color: var(--text-muted) !important;
        }

        .navbar-brand {
            font-weight: 700;
            background: linear-gradient(135deg, #dc2626 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .h5 {
            color: var(--text-primary);
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #dc2626 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-text {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .alert-container {
            position: fixed;
            top: 100px;
            right: 20px;
            z-index: 1050;
            max-width: 400px;
        }
    </style>
</head>
<body>
<!-- Flash Messages -->
<div class="alert-container">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/manager/dashboard}">🛠️ AutoDetail - Менеджер</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/manager/items}">📦 Товары</a>
            <a class="nav-link" th:href="@{/manager/clients}">👥 Клиенты</a>
            <a class="nav-link active" th:href="@{/manager/orders}">📋 Заказы</a>
        </div>
        <div class="navbar-nav ms-auto">
            <div class="theme-switch">
                <span class="theme-switch-label">☀️</span>
                <label class="switch">
                    <input type="checkbox" id="themeToggle">
                    <span class="slider"></span>
                </label>
                <span class="theme-switch-label">🌙</span>
            </div>
            <span class="navbar-text me-3">
                Вы вошли как: <strong>Менеджер</strong>
            </span>
            <form th:action="@{/auth/logout}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                <button type="submit" class="btn btn-outline-light btn-sm">🚪 Выйти</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title" th:text="${isEdit} ? '✏️ Редактирование заказа' : '➕ Создание нового заказа'">Форма заказа</h4>
                    <p class="card-subtitle" th:text="${isEdit} ? 'Обновите информацию о заказе' : 'Заполните данные нового заказа'"></p>
                </div>

                <div class="card-body">
                    <!-- Форма для создания -->
                    <form th:unless="${isEdit}" id="createOrderForm" class="order-form">
                        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>

                        <!-- Участники заказа -->
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Клиент *</label>
                                    <select class="form-select" id="clientSelect" name="clientId" required>
                                        <option value="">Выберите клиента</option>
                                        <option th:each="client : ${clients}"
                                                th:value="${client.id}"
                                                th:text="${client.surname + ' ' + client.name + ' (' + client.phone + ')'}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Менеджер</label>
                                    <input type="text" class="form-control" th:value="${managerService.getUserFullName(currentManagerId)}" readonly>
                                    <input type="hidden" name="userId" th:value="${currentManagerId}">
                                    <small class="form-text">Авторизованный менеджер</small>
                                </div>
                            </div>
                        </div>

                        <!-- Выбор товаров -->
                        <div class="row mb-4">
                            <div class="col-12">
                                <h5>🛒 Выбор товаров</h5>
                                <div class="table-responsive">
                                    <table class="table table-sm">
                                        <thead>
                                        <tr>
                                            <th>Товар</th>
                                            <th width="100">Цена</th>
                                            <th width="120">Количество</th>
                                            <th width="100">Сумма</th>
                                            <th width="80">Действия</th>
                                        </tr>
                                        </thead>
                                        <tbody id="orderItemsTable">
                                        <!-- Строки будут добавляться динамически -->
                                        </tbody>
                                        <tfoot>
                                        <tr>
                                            <td colspan="3" class="text-end"><strong>Общая сумма:</strong></td>
                                            <td><strong id="totalAmount">0.00 ₽</strong></td>
                                            <td></td>
                                        </tr>
                                        </tfoot>
                                    </table>
                                </div>

                                <!-- Добавление товара -->
                                <div class="row g-2 align-items-end">
                                    <div class="col-md-4">
                                        <label class="form-label">Товар</label>
                                        <select class="form-select" id="itemSelect">
                                            <option value="">Выберите товар</option>
                                            <option th:each="item : ${availableItems}"
                                                    th:value="${item.id}"
                                                    th:data-price="${item.price}"
                                                    th:text="${item.name + ' - ' + item.price + ' ₽ (в наличии: ' + item.quantity + ')'}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label">Цена</label>
                                        <input type="number" step="0.01" class="form-control" id="itemPrice" readonly>
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label">Количество</label>
                                        <input type="number" class="form-control" id="itemQuantity" value="1" min="1">
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label">Сумма</label>
                                        <input type="text" class="form-control" id="itemTotal" readonly>
                                    </div>
                                    <div class="col-md-2">
                                        <button type="button" class="btn btn-success w-100" onclick="addOrderItem()">➕ Добавить</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Детали заказа -->
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Общая сумма</label>
                                    <div class="input-group">
                                        <input type="number" step="0.01" class="form-control" id="totalAmountInput" name="totalAmount" readonly>
                                        <span class="input-group-text">₽</span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Статус заказа *</label>
                                    <select class="form-select" name="statusId" required>
                                        <option value="">Выберите статус</option>
                                        <option th:each="status : ${statuses}"
                                                th:value="${status.id}"
                                                th:text="${status.status}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Скрытое поле для товаров -->
                        <input type="hidden" id="orderItemsJson" name="orderItems">

                        <div class="d-flex gap-2">
                            <a th:href="@{/manager/orders}" class="btn btn-secondary">❌ Отмена</a>
                            <button type="button" onclick="submitOrder()" class="btn btn-primary">✅ Создать заказ</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Theme management
    document.addEventListener('DOMContentLoaded', function() {
        const themeToggle = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'light';

        // Apply saved theme
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeToggle.checked = currentTheme === 'dark';

        // Toggle theme
        themeToggle.addEventListener('change', function() {
            const newTheme = this.checked ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        // Автоматически закрываем алерты через 5 секунд
        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(alert => {
            setTimeout(() => {
                const bsAlert = new bootstrap.Alert(alert);
                bsAlert.close();
            }, 5000);
        });
    });

    let orderItems = [];

    // Обновление цены при выборе товара
    $('#itemSelect').change(function() {
        const selectedOption = $(this).find('option:selected');
        const price = selectedOption.data('price') || 0;
        $('#itemPrice').val(price);
        calculateItemTotal();
    });

    // Обновление суммы при изменении количества
    $('#itemQuantity').on('input', calculateItemTotal);

    function calculateItemTotal() {
        const price = parseFloat($('#itemPrice').val()) || 0;
        const quantity = parseInt($('#itemQuantity').val()) || 0;
        const total = price * quantity;
        $('#itemTotal').val(total.toFixed(2));
    }

    function addOrderItem() {
        const itemSelect = $('#itemSelect');
        const itemId = itemSelect.val();
        const itemName = itemSelect.find('option:selected').text();
        const price = parseFloat($('#itemPrice').val());
        const quantity = parseInt($('#itemQuantity').val());

        if (!itemId || !price || !quantity) {
            alert('Заполните все поля товара');
            return;
        }

        // Проверяем, не добавлен ли уже этот товар
        const existingItem = orderItems.find(item => item.itemId == itemId);
        if (existingItem) {
            existingItem.quantity += quantity;
        } else {
            orderItems.push({
                itemId: itemId,
                itemName: itemName,
                price: price,
                quantity: quantity
            });
        }

        updateOrderItemsTable();
        calculateTotalAmount();

        // Сбрасываем форму добавления
        itemSelect.val('');
        $('#itemPrice').val('');
        $('#itemQuantity').val(1);
        $('#itemTotal').val('');
    }

    function updateOrderItemsTable() {
        const table = $('#orderItemsTable');
        table.empty();

        orderItems.forEach((item, index) => {
            const rowTotal = item.price * item.quantity;
            const row = `
                <tr>
                    <td>${item.itemName}</td>
                    <td>${item.price.toFixed(2)} ₽</td>
                    <td>${item.quantity}</td>
                    <td>${rowTotal.toFixed(2)} ₽</td>
                    <td>
                        <button type="button" class="btn btn-danger btn-sm" onclick="removeOrderItem(${index})">🗑️</button>
                    </td>
                </tr>
            `;
            table.append(row);
        });
    }

    function removeOrderItem(index) {
        orderItems.splice(index, 1);
        updateOrderItemsTable();
        calculateTotalAmount();
    }

    function calculateTotalAmount() {
        const total = orderItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        $('#totalAmount').text(total.toFixed(2) + ' ₽');
        $('#totalAmountInput').val(total.toFixed(2));
    }

    function submitOrder() {
        if (orderItems.length === 0) {
            alert('Добавьте хотя бы один товар в заказ');
            return;
        }

        if (!$('#clientSelect').val()) {
            alert('Выберите клиента');
            return;
        }

        // Подготавливаем данные для отправки
        const orderItemsData = orderItems.map(item => ({
            itemId: item.itemId,
            quantity: item.quantity,
            price: item.price
        }));

        $('#orderItemsJson').val(JSON.stringify(orderItemsData));

        // Отправляем форму
        $('#createOrderForm').attr('action', '/manager/orders/create-with-items');
        $('#createOrderForm').attr('method', 'post');
        $('#createOrderForm').submit();
    }
</script>
</body>
</html>
