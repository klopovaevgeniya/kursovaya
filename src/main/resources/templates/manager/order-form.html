<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма заказа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/manager/dashboard}">🛠️ AutoDetail - Менеджер</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/manager/dashboard}">Главная</a>
            <a class="nav-link" th:href="@{/manager/items}">Товары</a>
            <a class="nav-link" th:href="@{/manager/clients}">Клиенты</a>
            <a class="nav-link" th:href="@{/manager/orders}">Заказы</a>
            <a class="nav-link" th:href="@{/manager/messages}">Сообщения</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title mb-0" th:text="${isEdit} ? '✏️ Редактирование заказа' : '➕ Создание нового заказа'">Форма заказа</h4>
                </div>
                <div class="card-body">
                    <!-- Сообщения об ошибках -->
                    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show">
                        <span th:if="${param.error == 'not_found'}">Заказ не найден</span>
                        <span th:if="${param.error == 'load_error'}">Ошибка загрузки формы</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                        <span th:text="${error}">Ошибка</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Форма для редактирования -->
                    <form th:if="${isEdit}" th:action="@{/manager/orders/update/{id}(id=${order.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Клиент *</label>
                                <select class="form-select" name="clientId" required>
                                    <option value="">Выберите клиента</option>
                                    <option th:each="client : ${clients}"
                                            th:value="${client.id}"
                                            th:text="${client.surname + ' ' + client.name + ' (' + client.phone + ')'}"
                                            th:selected="${order.clientId == client.id}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Менеджер (ID пользователя)</label>
                                <input type="number" class="form-control" name="userId" th:value="${order.userId}" placeholder="Введите ID менеджера">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Сумма заказа *</label>
                                <input type="number" step="0.01" class="form-control" name="totalAmount"
                                       th:value="${order.totalAmount}" placeholder="0.00" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Статус заказа *</label>
                                <select class="form-select" name="statusId" required>
                                    <option value="">Выберите статус</option>
                                    <option th:each="status : ${statuses}"
                                            th:value="${status.id}"
                                            th:text="${status.status}"
                                            th:selected="${order.statusId == status.id}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Дата создания</label>
                            <input type="datetime-local" class="form-control" name="createdAt"
                                   th:value="${#temporals.format(order.createdAt, 'yyyy-MM-dd\'T\'HH:mm')}">
                            <div class="form-text">Оставьте пустым для автоматической установки текущей даты</div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/manager/orders}" class="btn btn-secondary me-md-2">❌ Отмена</a>
                            <button type="submit" class="btn btn-primary">💾 Сохранить изменения</button>
                        </div>
                    </form>

                    <!-- Форма для создания -->
                    <form th:unless="${isEdit}" th:action="@{/manager/orders}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Клиент *</label>
                                <select class="form-select" name="clientId" required>
                                    <option value="">Выберите клиента</option>
                                    <option th:each="client : ${clients}"
                                            th:value="${client.id}"
                                            th:text="${client.surname + ' ' + client.name + ' (' + client.phone + ')'}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Менеджер (ID пользователя)</label>
                                <input type="number" class="form-control" name="userId" placeholder="Введите ID менеджера">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Сумма заказа *</label>
                                <input type="number" step="0.01" class="form-control" name="totalAmount" placeholder="0.00" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Статус заказа *</label>
                                <select class="form-select" name="statusId" required>
                                    <option value="">Выберите статус</option>
                                    <option th:each="status : ${statuses}"
                                            th:value="${status.id}"
                                            th:text="${status.status}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Дата создания</label>
                            <input type="datetime-local" class="form-control" name="createdAt">
                            <div class="form-text">Оставьте пустым для автоматической установки текущей даты</div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/manager/orders}" class="btn btn-secondary me-md-2">❌ Отмена</a>
                            <button type="submit" class="btn btn-primary">✅ Создать заказ</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
