<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Редактирование заказа' : 'Создание заказа'">Форма заказа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/manager/dashboard}">🛠️ AutoDetail - Менеджер</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/manager/dashboard}">Главная</a>
            <a class="nav-link" th:href="@{/manager/items}">Товары</a>
            <a class="nav-link" th:href="@{/manager/clients}">Клиенты</a>
            <a class="nav-link" th:href="@{/manager/orders}">Заказы</a>
            <a class="nav-link" th:href="@{/manager/messages}">Сообщения</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title mb-0" th:text="${isEdit} ? '✏️ Редактирование заказа' : '➕ Создание нового заказа'"></h4>
                </div>
                <div class="card-body">
                    <form th:action="${isEdit} ? @{/manager/orders/update/{id}(id=${order.id}) : @{/manager/orders}"
                          method="post">

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Клиент *</label>
                                <select class="form-select" name="clientId" required>
                                    <option value="">Выберите клиента</option>
                                    <option th:each="client : ${clients}"
                                            th:value="${client.id}"
                                            th:text="${client.surname + ' ' + client.name + ' (' + client.phone + ')'}"
                                            th:selected="${order.clientId == client.id}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Менеджер (ID пользователя)</label>
                                <input type="number" class="form-control" name="userId" th:value="${order.userId}" placeholder="Введите ID менеджера">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Сумма заказа *</label>
                                <input type="number" step="0.01" class="form-control" name="totalAmount"
                                       th:value="${order.totalAmount}" placeholder="0.00" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Статус заказа *</label>
                                <select class="form-select" name="statusId" required>
                                    <option value="">Выберите статус</option>
                                    <option th:each="status : ${statuses}"
                                            th:value="${status.id}"
                                            th:text="${status.status}"
                                            th:selected="${order.statusId == status.id}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Дата создания</label>
                            <input type="datetime-local" class="form-control" name="createdAt"
                                   th:value="${#temporals.format(order.createdAt, 'yyyy-MM-dd\'T\'HH:mm')}">
                            <div class="form-text">Оставьте пустым для автоматической установки текущей даты</div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/manager/orders}" class="btn btn-secondary me-md-2">❌ Отмена</a>
                            <button type="submit" class="btn btn-primary" th:text="${isEdit} ? '💾 Сохранить изменения' : '✅ Создать заказ'"></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
